# ---------------------------------------------------------------------------
# Builds and pushes the Portcullis images to Docker Hub (simplitics1) on every
# push to main/master, feature/** and release/** branches.
#
# Tagging:
#   main / master   -> :latest
#   feature/foo     -> :feature-foo
#   release/1.2.0   -> :release-1.2.0
#
# Required repository secrets:
#   DOCKERHUB_USERNAME  - Docker Hub account (simplitics1)
#   DOCKERHUB_TOKEN     - Docker Hub access token with Read/Write scope
# ---------------------------------------------------------------------------
name: Build & push images

on:
  push:
    branches:
      - main
      - master
      - "feature/**"
      - "release/**"
  workflow_dispatch:

env:
  REGISTRY_NAMESPACE: simplitics1

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: portcullis
            context: .
            dockerfile: ./Dockerfile
          - name: portcullis-frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image tag from branch
        id: tag
        run: |
          branch="${GITHUB_REF_NAME}"
          if [ "$branch" = "main" ] || [ "$branch" = "master" ]; then
            tag="latest"
          else
            # Docker tags allow [A-Za-z0-9_.-] only; collapse anything else to '-'
            tag="$(printf '%s' "$branch" | tr -c 'A-Za-z0-9_.-' '-' | cut -c1-128)"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Building ${REGISTRY_NAMESPACE}/${{ matrix.name }}:$tag"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ env.REGISTRY_NAMESPACE }}/${{ matrix.name }}:${{ steps.tag.outputs.tag }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          provenance: false
